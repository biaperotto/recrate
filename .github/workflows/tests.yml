name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,mcp]"
      - name: Make the half-resolution reuse example
        run: python examples/workflowhub-nuclei-segmentation/make_half_resolution.py
      - name: Validate run crates (rocrate-validator, Workflow Run Crate 0.5)
        run: pytest -q tests/test_rocrate_validator.py
      - run: pytest -q
