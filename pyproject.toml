[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recrate"
version = "0.1.0"
description = "Reuse published methods on your data, checked and recorded with RO-Crate."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "The ReCRATE contributors" }]
keywords = ["RO-Crate", "FAIR", "reproducibility", "provenance", "Fiji", "ImageJ", "MCP", "bioimaging"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "numpy>=1.24",
  "tifffile>=2023.7",
  "scikit-image>=0.21",
  "pillow>=10",
]

[project.optional-dependencies]
fiji = ["pyimagej>=1.5"]
mcp = ["mcp>=1.2"]  # 1.x (FastMCP) and 2.x (MCPServer) both supported
app = ["streamlit>=1.30", "pandas>=2"]
dev = ["pytest>=7"]
all = ["pyimagej>=1.5", "mcp>=1.2", "streamlit>=1.30", "pandas>=2", "pytest>=7"]

[project.scripts]
recrate = "recrate.cli:main"
recrate-mcp = "recrate.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
recrate = ["workflows/*.ijm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
