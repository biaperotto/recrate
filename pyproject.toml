[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recrate"
version = "0.1.0"
description = "Turn a paper into an agent that runs its methods on your data, checked and recorded with RO-Crate."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "The ReCRATE contributors" }]
keywords = ["RO-Crate", "FAIR", "reproducibility", "provenance", "Fiji", "ImageJ", "MCP", "bioimaging"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "numpy>=1.24",
  "tifffile>=2023.7",
  "scikit-image>=0.21",
  "pillow>=10",
  "pypdf>=4",
  "pyyaml>=6",
  "certifi",
]

[project.optional-dependencies]
fiji = ["pyimagej>=1.5"]
draft = ["anthropic>=0.40"]
mcp = ["mcp>=1.2", "matplotlib>=3.7"]  # mcp 1.x (FastMCP) and 2.x (MCPServer); matplotlib for make_figure
app = ["streamlit>=1.43", "pandas>=2", "matplotlib>=3.7", "roc-validator>=0.12"]  # validator: the sidebar's check
dev = ["pytest>=7", "roc-validator>=0.12"]  # roc-validator: run crates are checked against the RO-Crate profiles
all = ["pyimagej>=1.5", "anthropic>=0.40", "mcp>=1.2", "streamlit>=1.43", "pandas>=2", "matplotlib>=3.7", "pytest>=7"]

[project.scripts]
recrate = "recrate.cli:main"
recrate-mcp = "recrate.mcp_server:main"  # recrate-mcp <paper agent folder>

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
recrate = ["workflows/*.ijm", "workflows/*.py", "skill/*.md", "skill/agents/*.md", "favicon.svg"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["agents", "examples/*/paper_agent", "examples/*/paper-download"]

[tool.ruff.lint]
select = ["E9", "F", "I"]  # syntax errors, pyflakes (undefined names, unused imports), import order

[tool.mypy]
# Type-checked in CI: the modules that pass today, so they stay clean. The others are listed by
# `mypy src/recrate` and join this list as they are fixed.
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "silent"
files = [
    "src/recrate/__init__.py",
    "src/recrate/cli.py",
    "src/recrate/compare.py",
    "src/recrate/drafter.py",
    "src/recrate/export.py",
    "src/recrate/figures.py",
    "src/recrate/hardware.py",
    "src/recrate/install.py",
    "src/recrate/methods.py",
    "src/recrate/model.py",
    "src/recrate/overlay.py",
    "src/recrate/package.py",
    "src/recrate/paper_crate.py",
    "src/recrate/paper_figures.py",
    "src/recrate/profiles/__init__.py",
    "src/recrate/profiles/generic.py",
    "src/recrate/profiles/timeseries.py",
    "src/recrate/record.py",
    "src/recrate/report.py",
    "src/recrate/runners/base.py",
    "src/recrate/runners/engines.py",
    "src/recrate/runners/fiji.py",
    "src/recrate/runners/python_ref.py",
    "src/recrate/sandbox.py",
    "src/recrate/sources.py",
    "src/recrate/verify.py",
    "src/recrate/workflow_state.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs network access (the RO-Crate validator); skipped offline, RECRATE_TEST_NETWORK=1 forces"]
